<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krijo Ankesë të Re</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-advanced py-2 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold" href="{{ url_for('index') }}">
                <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
                <span>HelpDesk <span class="text-gradient">Professional</span></span>
            </a>
            <a href="{{ url_for('index') }}" class="btn-advanced text-decoration-none">
                <i class="fa-solid fa-arrow-left me-2"></i>Ankesat e Mia
            </a>
        </div>
    </nav>

    <main class="container-fluid px-4 px-lg-5 pb-4">
        <section class="panel-card create-complaint-shell mx-auto">
            <div class="panel-header d-flex align-items-center justify-content-between">
                <span><i class="fa-regular fa-pen-to-square me-2 text-info"></i>Krijo Ankesë të Re</span>
                <span class="text-secondary small">Plotësoni të gjitha të dhënat</span>
            </div>
            <div class="p-4 p-lg-5">
                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}
                <form method="POST" enctype="multipart/form-data" class="create-complaint-form">
                    <div class="row g-4">
                        <div class="col-lg-6">
                            <label for="complaintType" class="form-label-custom">Forma e Ankesës</label>
                            <select id="complaintType" name="complaint_type" class="form-control-advanced w-100" required>
                                <option value="Online">Online</option>
                                <option value="Jo Online (Në zyrë / Sportel)">Jo Online (Në zyrë / Sportel)</option>
                                <option value="Telefonike">Telefonike</option>
                                <option value="Email">Email</option>
                                <option value="Tjetër">Tjetër</option>
                            </select>
                        </div>
                        <div class="col-lg-6">
                            <label for="category" class="form-label-custom">Kategoria</label>
                            <select id="category" name="category" class="form-control-advanced w-100" required>
                                <option value="" disabled selected>Zgjidhni kategorinë...</option>
                                {% for category in categories %}
                                <option value="{{ category.name }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-lg-6">
                            <label for="priority" class="form-label-custom">Niveli i Urgjencës</label>
                            <select id="priority" name="priority" class="form-control-advanced w-100" required>
                                <option value="E ulët">E ulët</option>
                                <option value="Mesatare" selected>Mesatare</option>
                                <option value="E lartë">E lartë</option>
                            </select>
                        </div>
                        <div class="col-lg-6">
                            <label for="attachments" class="form-label-custom">Bashkëngjitje</label>
                            <input type="file" id="attachments" name="attachments" multiple
                                   class="form-control-advanced w-100"
                                   accept=".pdf,.png,.jpg,.jpeg,.gif,.txt,.doc,.docx">
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label-custom">Përshkrimi i Ankesës</label>
                            <textarea id="description" name="description" rows="7"
                                      class="form-control-advanced w-100"
                                      minlength="10" maxlength="3000"
                                      placeholder="Përshkruani problemin sa më hollësisht..."
                                      required></textarea>
                            <div class="text-secondary small mt-2">Minimumi 10 karaktere.</div>
                        </div>
                        <div class="col-12 d-flex justify-content-end gap-3 pt-2">
                            <a href="{{ url_for('index') }}" class="btn btn-outline-light px-4">Anulo</a>
                            <button type="submit" class="btn-advanced px-5">
                                <i class="fa-regular fa-paper-plane me-2"></i>Dërgo Ankesën
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
