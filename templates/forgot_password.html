<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harrova fjalëkalimin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card auth-container">
        <h2>Harrova fjalëkalimin</h2>
        {% if message %}
            <div class="error-msg">{{ message }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn-neon">Dërgo lidhjen</button>
        </form>
        <div class="auth-link"><a href="/login">Kthehu te hyrja</a></div>
    </div>
</body>
</html>
