<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menaxhimi i Ankesave dhe Kërkesave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary mb-5 fw-bold">Sistemi për Menaxhimin e Ankesave</h1>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        Krijo Ankesë / Kërkesë të Re
                    </div>
                    <div class="card-body">
                        <form id="complaintForm">
                            <div class="mb-3">
                                <label for="clientName" class="form-label">Emri i Klientit</label>
                                <input type="text" class="form-control" id="clientName" required>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">Kategoria</label>
                                <select class="form-select" id="category" required>
                                    <option value="" selected disabled>Zgjidh kategorinë...</option>
                                    <option value="Teknike">Teknike</option>
                                    <option value="Administrative">Administrative</option>
                                    <option value="Financiare">Financiare</option>
                                    <option value="Tjetër">Tjetër</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Përshkrimi i Ankesës</label>
                                <textarea class="form-control" id="description" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Dërgo Ankesën</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        Lista e Ankesave Ekzistuese
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Klienti</th>
                                        <th>Kategoria</th>
                                        <th>Përshkrimi</th>
                                        <th>Statusi</th>
                                    </tr>
                                </thead>
                                <tbody id="complaintsTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">Duke ngarkuar...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
