<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyçu në Sistem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card auth-container">
        <h2>Kyçu në Sistem</h2>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Fjalëkalimi</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-neon">Hyr</button>
        </form>
        <div class="auth-link">
            Nuk keni llogari? <a href="/register">Regjistrohu këtu</a>
        </div>
        <div class="auth-link">
            <a href="/forgot-password">Keni harruar fjalëkalimin?</a>
        </div>
    </div>
</body>
</html>
